name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Dependency advisories change without any commit of ours.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for committed secrets
        run: |
          # Deliberately narrow: real key shapes, not anything that merely
          # contains the word "secret", so the check stays actionable.
          patterns=(
            'sk-[A-Za-z0-9_-]{20,}'
            'sk_(live|test)_[A-Za-z0-9]{20,}'
            'gh[pousr]_[A-Za-z0-9]{30,}'
            'xox[abprs]-[A-Za-z0-9-]{20,}'
            'AKIA[0-9A-Z]{16}'
            '-----BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY-----'
            'postgres(ql)?://[^:]+:[^@\s]+@'
          )
          # Excluded paths are the ones whose *job* is to contain key-shaped
          # text: the redactor's own pattern list, its tests, the SDK's error
          # fixtures, and documentation showing the shape of a connection
          # string. All of them are reviewed in pull requests.
          exclude=(
            ':!pnpm-lock.yaml'
            ':!*.png'
            ':!.env.example'
            ':!docs/'
            ':!.github/workflows/security.yml'
            ':!packages/observability/src/redact.ts'
            ':!packages/observability/src/__tests__/'
            ':!packages/sdk/src/__tests__/'
            ':!packages/security/src/__tests__/'
          )
          found=0
          for pattern in "${patterns[@]}"; do
            if git grep -nIE "$pattern" -- "${exclude[@]}"; then
              echo "::error::Possible secret matching /$pattern/ is committed."
              found=1
            fi
          done
          exit $found

  security-tests:
    name: Security test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MCP_HUB_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: SSRF, crypto, risk classification and injection scanning
        run: pnpm --filter @mcp-hub/security test

      - name: Tenant isolation, IDOR, privilege escalation and approval bypass
        run: pnpm --filter @mcp-hub/api test

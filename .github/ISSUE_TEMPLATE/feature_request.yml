name: Feature request
description: Suggest a capability MCP Hub should have.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do that MCP Hub makes hard or impossible today?
        Describe the situation rather than the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen

  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried instead
